# Builds the site and publishes it to GitHub Pages.
#
# Prerequisite (one time): in the repository settings, under Pages, set
# "Source" to "GitHub Actions". Without that, this workflow succeeds but
# nothing is served.
#
# The custom domain is configured by public/CNAME, which Astro copies into
# dist/ during the build.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a deploy to be triggered by hand from the Actions tab.
  workflow_dispatch:

# Required by actions/deploy-pages. `id-token` is used for the OIDC handshake.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but do not cancel a deploy already in flight —
# cancelling mid-publish can leave the site partially updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
